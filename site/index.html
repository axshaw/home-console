<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Home Console</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    /* Every theme draws on a fixed 1280×800 stage that is scaled to fit the screen. */
    #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; }
    #switch { position: fixed; top: 0; right: 0; width: 120px; height: 120px; z-index: 100; }
  </style>

  <!-- Settings: defaults, then optional local overrides and token (404s are harmless). -->
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="token.js"></script>

  <!-- Core and data sources. -->
  <script src="core/format.js"></script>
  <script src="core/model.js"></script>
  <script src="core/config.js"></script>
  <script src="core/themes.js"></script>
  <script src="core/art.js"></script>
  <script src="sources/homeassistant.js"></script>
  <script src="sources/demo.js"></script>
  <script src="sources/json.js"></script>

  <!-- Themes, in tap-cycle order. -->
  <script src="themes/lcars.js"></script>
  <script src="themes/hud.js"></script>
  <script src="themes/crt.js"></script>
  <script src="themes/cyber.js"></script>
  <script src="themes/home.js"></script>
  <script src="themes/halloween.js"></script>
  <script src="themes/xmas.js"></script>
  <script src="themes/astrolabe.js"></script>

  <script src="core/app.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="switch" title="Tap to change theme"></div>
  <script>HC.app.start(window);</script>
</body>
</html>
